#overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:12px;background:#030914c9;backdrop-filter:blur(5px)}.panel{width:min(720px,100%);max-height:96%;overflow:auto;background:linear-gradient(145deg,#193653,#0a1728 75%);border:1px solid #7091b2;border-radius:20px;padding:clamp(14px,3vw,24px);box-shadow:0 20px 70px #000c,inset 0 1px #fff2}.panel h1{font-size:clamp(22px,4vw,34px);line-height:1.1;margin:0 0 8px}.panel h1 span{color:var(--cyan)}.panel h2{margin:0 0 8px}.panel p{color:#c3d4e7;line-height:1.45}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:#dce8f5}.field input,.field select{width:100%;border:1px solid #587895;border-radius:9px;background:#091827;color:white;padding:10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.crewline{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.crewchip{background:#0c1c2e;border:1px solid #355774;border-radius:10px;padding:7px 9px;font-size:12px}.crewchip b{display:block}.section{border:1px solid #395a77;background:#091a2a88;border-radius:13px;padding:12px;margin:10px 0}.taskrow{display:flex;align-items:center;gap:8px;border:1px solid #34536d;background:#10263c;border-radius:10px;padding:9px;margin:6px 0}.taskrow span{flex:1}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}.choices button{min-height:48px}.small{font-size:12px;color:#b6c8db}.badge{display:inline-block;border:1px solid #5e86a7;border-radius:99px;padding:4px 8px;font-size:11px;color:#cdeaff}.dangerText{color:#ff9aa8!important}

.v3btn{background:linear-gradient(135deg,#1b526b,#12344b);border:1px solid #65d9ee}.v3hero{background:linear-gradient(135deg,#1d4057,#0a1a2a);border:1px solid #4e7895;border-radius:15px;padding:14px;margin:10px 0}.v3room{height:155px;border:2px solid #6d8799;border-radius:12px;position:relative;overflow:hidden;background:radial-gradient(ellipse at center,#536575 0,#293b4c 55%,#111d29 100%);margin:10px 0}.v3room:before{content:'';position:absolute;inset:12px;border:2px solid #879ba9;border-radius:18px;box-shadow:inset 0 0 0 6px #172632, inset 0 0 20px #0008}.v3bench{position:absolute;left:8%;top:30%;width:24%;height:20px;background:#607687;border:2px solid #aab9c4;border-radius:8px;box-shadow:0 8px 0 #263745}.v3crate{position:absolute;bottom:18px;width:29px;height:29px;background:#4b687b;border:2px solid #8da3b2;transform:rotate(3deg);box-shadow:inset 0 0 0 4px #344b5d}.v3crate.one{left:18%}.v3crate.two{right:23%;bottom:30px}.v3avatar{position:absolute;bottom:26px;left:48%;font-size:28px;animation:v3idle 1.8s ease-in-out infinite}.v3avatar.two{left:57%;animation-delay:.3s}.v3avatar.three{left:38%;animation-delay:.6s}.pet-preview{display:inline-block;font-size:32px;animation:petbob 1s ease-in-out infinite alternate}.crew-preview{display:inline-block;animation:v3idle 1.7s ease-in-out infinite}.task-meter{height:8px;background:#07111d;border:1px solid #688092;border-radius:99px;overflow:hidden}.task-meter span{display:block;height:100%;width:45%;background:#56dfa0;transition:width .25s}.meetingchat{height:130px;overflow:auto;background:#06111c;border:1px solid #3d5d76;border-radius:9px;padding:8px;font-size:12px}.chatline{margin:4px 0;padding:5px 7px;background:#12283a;border-radius:7px}.cosmicgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.cosmicitem{border:1px solid #52728a;background:#102338;border-radius:10px;padding:10px;text-align:center;cursor:pointer}.cosmicitem:focus,.cosmicitem:hover{border-color:#62e5f4;background:#183c53}.v3pill{border:1px solid #49728c;background:#10283b;color:#c8f5ff;border-radius:20px;padding:5px 9px;font-size:11px}
@keyframes v3idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}@keyframes petbob{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-5px) rotate(4deg)}}
@media(max-width:600px){.cosmicgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.v3room{height:125px}}
</style></head>
<body><div id="app">

<script>
(()=>{

let tasks=[],bots=[],bodies=[],player,started=false,ended=false,meeting=false,taskOpen=false,mapOpen=false,elapsed=0,killCooldown=0,meetCooldown=0,toastTimer=0,camX=0,camY=0,zoom=1,keys={},joy={x:0,y:0},last=0,role='Tripulante',impostorCount=1,botCount=9,meetingMode='follow',testVotes=true,vision=true,sabotage=null,abilityCooldown=0,taskProgress=0,settings={},secretClues=[],secretProgress=0,nextShipEvent=38,activeShipEvent=null,transformTimer=0,transformOriginal=null;

function mainMenu(){started=false;ended=false;meeting=false;taskOpen=false;$('hudTop').classList.add('hidden');$('hudStats').classList.add('hidden');$('bottom').classList.add('hidden');show(`<div style="text-align:center;padding:8px 0 14px"><div style="font-size:clamp(45px,9vw,84px);letter-spacing:2px;font-weight:1000;color:#fff;text-shadow:0 4px 0 #3e647f">AMONG US</div><div style="font-size:12px;letter-spacing:5px;color:#64dff2;margin-top:-4px">EDIÇÃO DA LENDA • V3 ALPHA</div><div class="v3room" style="height:185px;margin:20px 0;background:radial-gradient(ellipse at 50% 25%,#172b48,#030812 75%)"><div style="position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:31px 27px;opacity:.4"></div><span class="v3avatar" style="left:30%;bottom:45px">🧑‍🚀</span><span class="v3avatar two" style="left:46%;bottom:65px">🧑‍🚀</span><span class="v3avatar three" style="left:63%;bottom:38px">🧑‍🚀</span></div><div class="row" style="justify-content:center"><button class="primary" id="mainLocal">▶ LOCAL / JOGAR</button><button id="mainOnline">🌐 ONLINE</button><button id="mainFreeplay">🧭 LIVRE</button><button id="mainHow">📖 COMO JOGAR</button></div><div class="row" style="justify-content:center;margin-top:8px"><button class="v3btn" id="mainCubes">🌌 COSMICUBES</button><button class="v3btn" id="mainCosmetics">🎩 COSMÉTICOS</button></div><p class="small">Protótipo local para testar interfaces e mecânicas. O modo online ainda precisa de servidor.</p></div>`);$('mainLocal').onclick=lobby;$('mainFreeplay').onclick=lobby;$('mainOnline').onclick=()=>show(`<h2>🌐 Modo online</h2><p>O multiplayer pela internet ainda não está conectado nesta versão. Este protótipo permite testar localmente com bots.</p><button class="primary" id="backLobby">⬅ Voltar ao menu</button>`);$('mainHow').onclick=()=>show(`<h2>📖 Como jogar</h2><p>PC: WASD/setas para mover, E para interagir, F para eliminar como impostor, R para reunião, M para mapa, Q para habilidade e V para duto for(let [x,y,rx,ry] of [[445,105,35,22],[355,72,19,13],[545,72,19,13],[355,155,19,13],[545,155,19,13]]){ctx.fillStyle='#17293d';ctx.beginPath();ctx.ellipse(x+2,y+5,rx+3,ry+3,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#8299ad';ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#d1e2ef';ctx.stroke();ctx.fillStyle='#344d67';ctx.beginPath();ctx.ellipse(x,y-2,rx-5,ry-4,0,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#ed4d62';ctx.beginPath();ctx.arc(445,105,8,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ffd4d9';ctx.stroke();
drawProps();for(let v of [{x:145,y:260},{x:320,y:310},{x:600,y:280},{x:730,y:385}]){ctx.fillStyle='#18232c';ctx.fillRect(v.x-10,v.y-6,20,12);ctx.strokeStyle='#95a5b1';ctx.strokeRect(v.x-10,v.y-6,20,12);ctx.strokeStyle='#5a7284';ctx.beginPath();ctx.moveTo(v.x-6,v.y-2);ctx.lineTo(v.x+6,v.y-2);ctx.moveTo(v.x-6,v.y+2);ctx.lineTo(v.x+6,v.y+2);ctx.stroke()}for(let t of tasks){if(t.done||player?.isImpostor)continue;ctx.beginPath();ctx.arc(t.x,t.y,12+Math.sin(elapsed*4)*2,0,Math.PI*2);ctx.fillStyle='#ffce56';ctx.fill();ctx.strokeStyle='#fff3b5';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#3c2a00';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText('!',t.x,t.y+5)}
for(let c of secretClues){if(!c.found){ctx.fillStyle='#dca8ff';ctx.beginPath();ctx.arc(c.x,c.y,10+Math.sin(elapsed*3)*2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#1a1030';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText(c.symbol,c.x,c.y+4)}}for(let b of bodies){ctx.fillStyle='#e8f3fb';ctx.beginPath();ctx.ellipse(b.x,b.y,14,6,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#8fdcff';ctx.beginPath();ctx.ellipse(b.x+3,b.y-1,7,4,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff7185';ctx.font='bold 8px system-ui';ctx.fillText(b.clue?'PISTA':'CORPO',b.x,b.y+19)}
for(let b of bots)if(b.alive){drawCrew(b);drawPet(b)}if(player?.alive){drawCrew(player,true);drawPet(player)}
if(sabotage){ctx.fillStyle='#f33b5560';ctx.fillRect(0,0,900,620);ctx.fillStyle='#fff';ctx.font='bold 25px system-ui';ctx.textAlign='center';ctx.fillText('SABOTAGEM: '+sabotage.toUpperCase(),450,300)}
if(player&&started&&!player.isImpostor){ctx.save();let g=ctx.createRadialGradient(player.x,player.y,vision?95:65,player.x,player.y,vision?255:185);g.addColorStop(0,'#00000000');g.addColorStop(.55,'#02071135');g.addColorStop(1,'#020711f5');ctx.fillStyle=g;ctx.fillRect(0,0,900,620);ctx.restore()}if(activeShipEvent&&player&&!player.isImpostor){ctx.fillStyle='#05091535';ctx.fillRect(0,0,900,620)}
ctx.restore()}
function drawProps(){ctx.save();ctx.fillStyle='#172a40';ctx.fillRect(48,350,35,58);for(let i=0;i<3;i++){ctx.strokeStyle=['#ff626e','#f3d45c','#52d4ff'][i];ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(54,360+i*14);ctx.bezierCurveTo(65,354+i*14,65,370+i*14,77,363+i*14);ctx.stroke()}for(let [x,y] of [[350,345],[390,365],[445,330],[460,370]]){ctx.fillStyle='#344b60';ctx.fillRect(x,y,24,22);ctx.strokeStyle='#8196aa';ctx.strokeRect(x,y,24,22)}ctx.fillStyle='#172a40';ctx.fillRect(535,247,80,20);for(let i=0;i<3;i++){ctx.fillStyle=['#52d8ff','#70e59a','#f3d46a'][i];ctx.fillRect(539+i*25,251,15,7)}ctx.fillStyle='#172a40';ctx.fillRect(724,365,74,43);ctx.strokeStyle='#6de8ff';ctx.beginPath();ctx.arc(761,386,14,0,Math.PI*2);ctx.stroke();ctx.restore()}
function render(){if(!ctx)return;let w=innerWidth,h=innerHeight;if(canvas.width!==w||canvas.height!==h)resizeCanvas();ctx.clearRect(0,0,w,h);if(!started){ctx.fillStyle='#06101d';ctx.fillRect(0,0,w,h);return}const sx=w/540,sy=h/390;const scale=Math.max(.78,Math.min(sx,sy));ctx.save();ctx.translate(w/2,h/2);ctx.scale(scale,scale);ctx.translate(-(player?.x??450),-(player?.y??310));drawMap();ctx.restore()}
function updateHUD(){if(!started)return;let alive=[player,...bots].filter(b=>b.alive).length;let done=tasks.filter(t=>t.done).length;$('alive').textContent='👨‍🚀 '+alive+' vivos';$('taskCount').textContent=player.isImpostor?'🔪 '+player.role:`📋 Tarefas ${done}/${tasks.length}`;$('taskBar').style.width=(done/tasks.length*100)+'%';$('roomLabel').textContent='📍 '+roomAt(player.x,player.y);$('phase').textContent=meeting?'REUNIÃO':ended?'FIM DE JOGO':sabotage?'SABOTAGEM':'PARTIDA';$('killBtn').disabled=!player.isImpostor||killCooldown>0||!nearestVictim();$('killBtn').innerHTML=killCooldown>0?'⏳<br>'+Math.ceil(killCooldown)+'s':'🔪<br>MATAR';let canMeet=Math.hypot(player.x-445,player.y-105)<42;let body=!!nearestBody();$('reportBtn').disabled=meetCooldown>0||(!canMeet&&!body);$('reportBtn').innerHTML=meetCooldown>0?'⏳<br>'+Math.ceil(meetCooldown)+'s':body?'🩸<br>REPORTAR':'🚨<br>REUNIÃO';$('actionBtn').disabled=!nearestTask()&&!nearestBody()&&Math.hypot(player.x-445,player.y-105)>=42&&!player.carryingFuel;$('abilityBtn').innerHTML=player.transform>0?'↩️<br>VOLTAR':abilityCooldown>0?'⏳<br>'+Math.ceil(abilityCooldown)+'s':'✨<br>FUNÇÃO';$('abilityBtn').disabled=abilityCooldown>0&&player.role!=='Cientista'&&player.transform<=0;$('sabotageBtn').disabled=!!sabotage}
function updateBots(dt){for(let b of bots){if(!b.alive)continue;b.think-=dt;b.killCd-=dt;if(b.think<=0){b.think=1.2+Math.random()*2.2;let t=tasks.filter(x=>!x.done).sort(()=>Math.random()-.5)[0];if(!b.isImpostor&&t)b.target={x:t.x+(Math.random()-.5)*30,y:t.y+(Math.random()-.5)*30};else b.target=null;if(!b.target)b.dir=Math.random()*Math.PI*2}
let dx,dy;if(b.target){dx=b.target.x-b.x;dy=b.target.y-b.y;if(Math.hypot(dx,dy)<15){if(Math.random()<.5&&tasks.some(t=>!t.done)){let t=tasks.find(t=>!t.done);if(t&&!b.isImpostor)t.done=Math.random()<.1||t.done}b.target=null;b.think=2}}else{dx=Math.cos(b.dir);dy=Math.sin(b.dir)}let mag=Math.hypot(dx,dy)||1;let oldX=b.x,oldY=b.y;moveEntity(b,dx/mag*48,dy/mag*48,dt);if(Math.hypot(b.x-oldX,b.y-oldY)<.1)b.dir+=Math.PI*(.4+Math.random());if(b.isImpostor&&b.killCd<=0&&player.alive&&!player.isImpostor&&Math.hypot(b.x-player.x,b.y-player.y)<27){if(player.shield<=0){player.alive=false;bodies.push({x:player.x,y:player.y,victim:'Você'});say('Você foi eliminado! A partida continua.')}b.killCd=15}
if(b.isImpostor&&b.killCd<=0){let victim=bots.find(x=>x.alive&&!x.isImpostor&&x!==player&&Math.hypot(x.x-b.x,x.y-b.y)<25);if(victim){victim.alive=false;bodies.push({x:victim.x,y:victim.y,victim:victim.name});b.killCd=15}}
}}
function tick(ts){if(!last)last=ts;let dt=Math.min((ts-last)/1000,.04);last=ts;if(started&&!ended&&!meeting&&!taskOpen){elapsed+=dt;killCooldown=Math.max(0,killCooldown-dt);meetCooldown=Math.max(0,meetCooldown-dt);abilityCooldown=Math.max(0,abilityCooldown-dt);if(player.shield>0)player.shield=Math.max(0,player.shield-dt);if(player.transform>0){player.transform=Math.max(0,player.transform-dt);transformTimer=Math.max(0,transformTimer-dt);if(transformTimer<=0)endTransformation('O tempo da metamorfose acabou.');}if(elapsed>=nextShipEvent&&!activeShipEvent){const events=['Interferência no radar: os marcadores ficam confusos por alguns segundos.','Alerta misterioso: uma pista falsa apareceu na nave.','Pane de iluminação: a área visível ficou reduzida.'];activeShipEvent=events[Math.floor(Math.random()*events.length)];say('📡 EVENTO SECRETO: '+activeShipEvent);nextShipEvent=elapsed+55;setTimeout(()=>{activeShipEvent=null},10000)}let dx=0,dy=0;if(keys.ArrowLeft||keys.a||keys.A)dx--;if(keys.ArrowRight||keys.d||keys.D)dx++;if(keys.ArrowUp||keys.w||keys.W)dy--;if(keys.ArrowDown||keys.s||keys.S)dy++;dx+=joy.x;dy+=joy.y;let mag=Math.hypot(dx,dy);if(mag>1){dx/=mag;dy/=mag}if(mag>.08)moveEntity(player,dx*(player.carryingFuel?player.speed:player.speed),dy*(player.carryingFuel?player.speed:player.speed),dt);else if(player)player.moving=false;updateBots(dt);checkWin();if(sabotage&&Math.random()<.001){sabotage=null;say('A sabotagem foi resolvida automaticamente no protótipo.')}}if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$('toast').classList.add('hidden')}render();if(started)updateHUD();requestAnimationFrame(tick)}
addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.repeat)return;if(e.key==='e'||e.key==='Enter')interact();if(e.key==='f')kill();if(e.key==='r'){if(nearestBody())reportBody();else if(Math.hypot(player.x-445,player.y-105)<42)callMeeting()}if(e.key==='m'){mapOpen=!mapOpen;say(mapOpen?'Mapa aberto (marcadores amarelos são tarefas).':'Mapa fechado.')}if(e.key==='q')useAbility();if(e.key==='v')useVent();if(e.key==='Escape'&&taskOpen){taskOpen=false;hide()}});
addEventListener('keyup',e=>keys[e.key]=false);
$('ventBtn').onclick=useVent;$('actionBtn').onclick=interact;$('killBtn').onclick=kill;$('reportBtn').onclick=()=>{if(nearestBody())reportBody();else if(Math.hypot(player.x-445,player.y-105)<42)callMeeting();else say('Aproxime-se da mesa central ou de um corpo.')};$('abilityBtn').onclick=useAbility;$('sabotageBtn').onclick=sabotageAction;$('mapBtn').onclick=()=>{mapOpen=!mapOpen;if(mapOpen){let done=tasks.filter(t=>t.done).length;show(`<h2>🗺️ Minimapa da nave</h2><p>Salas da nave: Cafeteria, Engines, Reactor, Security, Electrical, Storage, Admin, Communications, MedBay, Shields, Weapons, O2, Navigation e Laboratório Secreto. As salas ficam em azul e os corredores conectam as áreas.</p><p>Tarefas concluídas: ${done}/${tasks.length}. Os marcadores amarelos indicam tarefas. Os brilhos roxos são pistas da história secreta (${secretProgress}/3); aproxime-se e use AÇÃO.</p><button class="primary" id="closeMap">Voltar à partida</button>`);$('closeMap').onclick=hide}else hide()};
const joyEl=$('joy'),nub=$('nub');let joyActive=false;function joyMove(e){let r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.34,mag=Math.hypot(dx,dy);if(mag>max){dx=dx/mag*max;dy=dy/mag*max}joy.x=dx/max;joy.y=dy/max;nub.style.transform=`translate(${dx}px,${dy}px)`}joyEl.addEventListener('pointerdown',e=>{joyActive=true;joyEl.setPointerCapture(e.pointerId);joyMove(e)});joyEl.addEventListener('pointermove',e=>{if(joyActive)joyMove(e)});function joyEnd(){joyActive=false;joy.x=joy.y=0;nub.style.transform='translate(0,0)'}joyEl.addEventListener('pointerup',joyEnd);joyEl.addEventListener('pointercancel',joyEnd);
mainMenu();checkOrientation();requestAnimationFrame(tick);
